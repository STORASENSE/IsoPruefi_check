# pgpool.conf
listen_addresses = '*'
port = 9999

# Backends
backend_hostname0 = 'postgres-1'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = 'postgres-2'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'ALLOW_TO_FAILOVER'

# Native replication mode
replication_mode = on
replication_stop_on_mismatch = off

# Load balancing (nur für selects, optional aus)
load_balance_mode = off

# Authentication - use SCRAM-SHA-256 for backend auth
enable_pool_hba = off
auth_method = 'scram-sha-256'
pool_passwd = '/etc/pgpool2/pool_passwd'

# Backend authentication 
backend_authentication_timeout = 60