name: isopruefi-docker

networks:
  isopruefi-network:
    driver: bridge
  isopruefi-monitoring:

services:
  traefik:
    image: traefik:3.4.4
    container_name: traefik
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 8432:8080
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8432"

      - "traefik.http.routers.dashboard.tls.domains[0].main=*.localhost"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.localhost"

      - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme = https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto = https"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./isopruefi-docker/traefik/traefik.yml:/traefik.yml:ro"
      - "./isopruefi-docker/traefik/conf:/conf:ro"
      - "./isopruefi-docker/traefik/certs/:/var/traefik/certs/:rw"
    networks:
      - isopruefi-network
      - isopruefi-monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Isopruefi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


 
  postgres-1:
    image: postgres:alpine3.21
    container_name: postgres-1
    restart: unless-stopped
    volumes:
      - postgres-1:/var/lib/postgresql/data
    networks:
      - isopruefi-network
    env_file:
      - ./secrets.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Isopruefi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgres-2:
    image: postgres:alpine3.21
    container_name: postgres-2
    restart: unless-stopped
    volumes:
      - postgres-2:/var/lib/postgresql/data
    networks:
      - isopruefi-network
    env_file:
      - ./secrets.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Isopruefi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  pgpool:
    build: ./pgpool
    container_name: pgpool
    depends_on:
      - postgres-1
      - postgres-2
    ports:
      - "9999:9999"
    networks:
      - isopruefi-network
    env_file:
      - ./secrets.env
  
  loki:
    image: grafana/loki:3.5.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./isopruefi-docker/loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - isopruefi-monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./isopruefi-docker/loki/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./isopruefi-docker/loki/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - isopruefi-monitoring
      - isopruefi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alloy:
    image: grafana/alloy:v1.9.2
    container_name: alloy
    ports:
      - 12345:12345
      - 4317:4317
      - 4318:4318
    volumes:
      - ./isopruefi-docker/loki/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - isopruefi-monitoring
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    volumes:
      - ./isopruefi-docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_LOG_LEVEL=warn
    env_file:
      - ./secrets.env
    #ports:
    # - 3000:3000/tcp
    networks:
      - isopruefi-monitoring
    depends_on:
      - loki
      - alloy


  isopruefi-frontend-1:
    build:
      context: ./isopruefi-frontend
      dockerfile: Dockerfile
    container_name: isopruefi-frontend-1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    volumes:
      - ./isopruefi-frontend:/app
      - /app/node_modules
    networks:
      - isopruefi-network
    env_file:
      - ./secrets.env
    stdin_open: true
    tty: true

  isopruefi-backend-api-1:
    build:
      context: ./isopruefi-backend
      dockerfile: Rest-API/Dockerfile-Dev
    container_name: isopruefi-backend-api-1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.localhost`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - isopruefi-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - ./secrets.env
    depends_on:
      - pgpool

  isopruefi-mqtt-receiver-1:
    build:
      context: ./isopruefi-backend
      dockerfile: MQTT-Receiver-Worker/Dockerfile-Dev
    container_name: isopruefi-mqtt-receiver-1
    networks:
      - isopruefi-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - ./secrets.env
    depends_on:
      - pgpool

  isopruefi-get-weather-worker-1:
    build:
      context: ./isopruefi-backend
      dockerfile: Get-weatherData-worker/Dockerfile-Dev
    container_name: isopruefi-get-weather-worker-1
    labels:
      - "prometheus.service=weather-worker"
      - "prometheus.instance=1"
    networks:
      - isopruefi-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - ./secrets.env
    depends_on:
      - pgpool

volumes:
    postgres-1:
    postgres-2: